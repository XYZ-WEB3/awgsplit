<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Статус VPN</title>
<style>
  /* Пример своей страницы «ВПН упал». Скопируйте файл, правьте и загрузите в панели:
     Сервисы → AWG Split → Обзор → «Страница ВПН упал» → «Загрузить свой HTML…» */
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; display: grid; place-items: center; min-height: 100vh; }
  main { text-align: center; padding: 24px; max-width: 520px; }
  h1 { font-size: 2.2rem; margin: 0 0 12px; }
  .up { color: #2ecc71; } .down { color: #e74c3c; } .off { color: #95a5a6; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; text-align: left; }
  li { padding: 8px 12px; margin: 6px 0; background: #1c1c1c; border-radius: 8px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<main>
  <h1 id="title" class="off">Проверяю…</h1>
  <p id="sub"></p>
  <ul id="list"></ul>
</main>
<script>
/* Данные берутся из /cgi-bin/awgsplit-state (открыт без входа, секретов в нём нет):
   { "state": "up" | "down" | "off",
     "tunnels": [ { "name": "main", "label": "США", "state": "up|pending|unknown|down|nodev",
                    "route": "tunnel | fallback:<имя> | direct", "hsage": секунд с последнего рукопожатия или -1 } ] }
   state: up — все туннели работают, down — трафик какого-то туннеля идёт напрямую (или заблокирован kill switch),
   off — служба выключена. */
var T = document.getElementById('title'), S = document.getElementById('sub'), L = document.getElementById('list');
function tick() {
  var x = new XMLHttpRequest();
  x.open('GET', '/cgi-bin/awgsplit-state?_=' + Date.now(), true);
  x.onload = function () {
    var d; try { d = JSON.parse(x.responseText); } catch (e) { return; }
    T.className = d.state;
    T.textContent = d.state === 'up' ? 'ВПН работает' : d.state === 'down' ? 'ВПН упал' : 'Служба выключена';
    S.textContent = d.state === 'down' ? 'Сайты из списков могут не открываться. Страница обновляется сама.' : '';
    L.innerHTML = '';
    (d.tunnels || []).forEach(function (t) {
      var li = document.createElement('li');
      li.textContent = t.label + ': ' + (t.route === 'direct' ? 'нет связи' : t.route === 'tunnel' ? 'работает' : 'идёт через запасной');
      L.appendChild(li);
    });
  };
  x.send();
}
tick(); setInterval(tick, 4000);
</script>
</body>
</html>
